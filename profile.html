<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Patient Profile – Test-Strip Analyzer</title>
  <style>
    body{font-family:sans-serif;max-width:700px;margin:1rem auto;padding:0 1rem;background:#f5f5f5}
    .section{background:#fff;padding:1rem;margin-bottom:1rem;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
    input,select,textarea{width:100%;padding:.5em;border:1px solid #ccc;border-radius:4px;margin:.3em 0;box-sizing:border-box}
    .checkbox-group label{display:inline-block;margin-right:1em}
    button{width:100%;padding:.8em;margin-top:1em;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer}
    button:hover{background:#0056b3}
    #msg{color:crimson;text-align:center;margin-top:.5em}
  </style>
</head>
<body>
  <h2>Patient Profile</h2>
  <form id="profileForm">
    <div class="section">
      <label>Barangay Health Center</label><input id="bhc" required/>
      <label>Preferred Hospital</label><input id="hospital" required/>
    </div>
    <div class="section">
      <label>Height (cm)</label><input id="height" type="number" step="0.1" required/>
      <label>Weight (kg)</label><input id="weight" type="number" step="0.1" required/>
    </div>
    <div class="section">
      <label>Lifestyle</label>
      <div class="checkbox-group">
        <label><input name="smoker" type="radio" value="Yes" required/> Smoker</label>
        <label><input name="smoker" type="radio" value="No"/> Non-Smoker</label>
      </div>
      <div class="checkbox-group">
        <label><input name="alcohol" type="radio" value="Yes" required/> Alcohol</label>
        <label><input name="alcohol" type="radio" value="No"/> None</label>
      </div>
    </div>
    <div class="section">
      <label>Medications</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="meds" value="Iron supplements"/> Iron</label>
        <label><input type="checkbox" name="meds" value="Folic acid"/> Folic acid</label>
        <label><input type="checkbox" name="meds" value="Multivitamins"/> Multivitamins</label>
        <label><input type="checkbox" name="meds" value="Calcium supplements"/> Calcium</label>
        <label><input type="checkbox" name="meds" value="Antihypertensives"/> Antihypertensives</label>
        <label><input type="checkbox" name="meds" value="Insulin"/> Insulin</label>
        <label><input type="checkbox" name="meds" value="Antibiotics"/> Antibiotics</label>
        <label><input type="checkbox" name="meds" value="Antacids"/> Antacids</label>
        <label>Others: <input id="meds_other"/></label>
      </div>
    </div>
    <div class="section">
      <label>LMP</label><input id="lmp" type="date" required/>
      <label>GTPAL</label><input id="gtpal" placeholder="G#T#P#A#L#" required/>
    </div>
    <div class="section">
      <label>Health Conditions</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="conds" value="Hypertension"/> Hypertension</label>
        <label><input type="checkbox" name="conds" value="GDM"/> GDM</label>
        <label><input type="checkbox" name="conds" value="UTI"/> UTI</label>
        <label><input type="checkbox" name="conds" value="Anemia"/> Anemia</label>
        <label><input type="checkbox" name="conds" value="Asthma"/> Asthma</label>
        <label><input type="checkbox" name="conds" value="Thyroid disorders"/> Thyroid</label>
        <label><input type="checkbox" name="conds" value="Heart disease"/> Heart disease</label>
        <label><input type="checkbox" name="conds" value="Epilepsy"/> Epilepsy</label>
        <label><input type="checkbox" name="conds" value="HIV"/> HIV</label>
        <label><input type="checkbox" name="conds" value="Tuberculosis"/> TB</label>
        <label>Others: <input id="conds_other"/></label>
      </div>
    </div>
    <div class="section">
      <label>Allergies</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="alls" value="Food"/> Food</label>
        <label><input type="checkbox" name="alls" value="Medication"/> Medication</label>
        <label><input type="checkbox" name="alls" value="Environmental"/> Environmental</label>
        <label><input type="checkbox" name="alls" value="Latex"/> Latex</label>
        <label>Others: <input id="alls_other"/></label>
      </div>
    </div>
    <div class="section">
      <label>Immunization</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="immu" value="TT"/> TT</label>
        <label><input type="checkbox" name="immu" value="Influenza"/> Influenza</label>
        <label><input type="checkbox" name="immu" value="COVID-19"/> COVID-19</label>
        <label><input type="checkbox" name="immu" value="Hepatitis B"/> Hep B</label>
        <label><input type="checkbox" name="immu" value="Tdap"/> Tdap</label>
        <label><input type="checkbox" name="immu" value="MMR"/> MMR</label>
        <label>Others: <input id="immu_other"/></label>
      </div>
    </div>
    <div class="section">
      <label>Consent</label>
      <div><label><input type="checkbox" id="c1" required/> Agree to data use</label></div>
      <div><label><input type="checkbox" id="c2" required/> Receive reminders</label></div>
      <div><label><input type="checkbox" id="c3" required/> Accept Privacy/Terms</label></div>
      <div><label><input type="checkbox" id="c4"/> Consent to anonymous research</label></div>
      <div><label><input type="checkbox" id="c5" required/> Understand prenatal check-ups</label></div>
    </div>
    <button type="button" id="saveProfile">Save & Continue to Analyzer</button>
    <div id="msg"></div>
  </form>

  <script>
    document.getElementById('saveProfile').onclick = () => {
      const form = document.getElementById('profileForm');
      const msg  = document.getElementById('msg');
      if (!form.reportValidity()) {
        msg.textContent = 'Complete all required fields.'; return;
      }
      const user = JSON.parse(localStorage.getItem('demo_user')||'null');
      if (!user) return location.href='index.html';
      const collect = id => document.getElementById(id).value;
      const profile = {
        bhc: collect('bhc'), hospital: collect('hospital'),
        height: +collect('height'), weight: +collect('weight'),
        smoker: document.querySelector('[name=smoker]:checked').value,
        alcohol:document.querySelector('[name=alcohol]:checked').value,
        meds: Array.from(document.querySelectorAll('[name=meds]:checked')).map(i=>i.value), meds_other: collect('meds_other'),
        lmp: collect('lmp'), gtpal: collect('gtpal'),
        conds: Array.from(document.querySelectorAll('[name=conds]:checked')).map(i=>i.value), conds_other: collect('conds_other'),
        alls: Array.from(document.querySelectorAll('[name=alls]:checked')).map(i=>i.value), alls_other: collect('alls_other'),
        immu:Array.from(document.querySelectorAll('[name=immu]:checked')).map(i=>i.value), immu_other:collect('immu_other'),
        consents: [c1.checked,c2.checked,c3.checked,c4.checked,c5.checked]
      };
      const lmpDate=new Date(profile.lmp), today=new Date();
      const diff=Math.floor((today-lmpDate)/864e5);
      profile.aog=Math.floor(diff/7)+" weeks";
      profile.edd=new Date(lmpDate.getTime()+280*864e5).toISOString().split('T')[0];
      localStorage.setItem('demo_profile',JSON.stringify(profile));
      location.href='analyzer.html';
    };
  </script>
</body>
</html>
